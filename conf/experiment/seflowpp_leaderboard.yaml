# @package _global_
defaults:
  - override /model: deflowpp

save_top_model: 3
val_every: 3
num_workers: 16
epochs: 9
batch_size: 4
num_frames: 3
loss_fn: seflowppLoss

voxel_size: [0.2, 0.2, 6]
point_cloud_range: [-51.2, -51.2, -3, 51.2, 51.2, 3]

ssl_label: seflowpp_auto

add_seloss:
  chamfer_dis: 1.0
  static_flow_loss: 1.0
  dynamic_chamfer_dis: 1.0
  cluster_based_pc0pc1: 1.0

optimizer:
  lr: 2e-4
  scheduler:
    name: StepLR

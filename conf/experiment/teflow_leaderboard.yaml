# @package _global_
defaults:
  - override /model: deltaflow

epochs: 15
batch_size: 2
num_frames: 5
train_aug: true
loss_fn: teflowLoss

voxel_size: [0.15, 0.15, 0.15]
point_cloud_range: [-38.4, -38.4, -3, 38.4, 38.4, 3]

ssl_label: seflow_auto

add_seloss:
  chamfer_dis: 1.0
  static_flow_loss: 1.0
  dynamic_chamfer_dis: 1.0
  cluster_based_pc0pc1: 1.0

optimizer:
  name: Adam
  lr: 2e-3
  scheduler:
    name: StepLR
    step_size: 9
    gamma: 0.5
